[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentpilot"
version = "0.1.0"
description = "Autonomous, human-supervised AI SRE incident response team built natively on Switch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "IncidentPilot Core Team" }
]
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.2",
    "rich>=13.8.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.1",
    "openai>=1.59.0",
    "chromadb>=0.5.0",
    "fastembed>=0.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "sandbox*", "evals*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "sandbox/tests", "evals"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

