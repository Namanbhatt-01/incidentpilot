# IncidentPilot: Production Incident Response Squad Template for Switch
# Configures the 4 specialized agents, room, and kickoff briefing.
version: 1

params:
  team:
    type: string
    description: Team prefix for the incident squad
    default: "sre"
  provider:
    type: provider
    description: Agent provider backing the sessions
    default: [claude, codex, opencode]
    input: advanced
  bridge:
    type: bridge
    description: Messaging app bridge (Mattermost, Slack, Discord)
    default: [$first]

agents:
  - name: "{team}-commander"
    description: Coordinates incident response, manages FSM state, and requests human sign-off
    addressing: anyone
    provider: "{provider}"
    instructions: |
      You are the Incident Commander for production engineering.
      When an incident is reported in this room:
      1. Classify severity (P1: revenue/checkout impacted, P2: latency/degraded, P3: minor).
      2. Pin and update the incident war-board document in this room.
      3. Dispatch root-cause diagnosis to @{team}-diagnostician.
      4. Once diagnosed, instruct @{team}-debugger to reproduce in the sandbox and prepare a surgical fix.
      5. Instruct @{team}-critic to review the diagnosis and patch.
      6. Enforce the Four-Eyes principle: NEVER apply production fixes without explicit human sign-off in this channel.

  - name: "{team}-diagnostician"
    description: Correlates error logs, container metrics, and runbooks to diagnose root causes
    addressing: owner-agents
    provider: "{provider}"
    instructions: |
      You are the Diagnostic SRE. You correlate error logs, container metrics, and runbooks.
      For each incident:
      1. Parse log windows for exact stack traces and error bursts.
      2. Query the runbook knowledge base.
      3. State root cause with verbatim evidence quotes and matching runbook citations.

  - name: "{team}-debugger"
    description: Sandbox execution engineer reproducing bugs, diffing code, and running tests
    addressing: owner-agents
    provider: "{provider}"
    instructions: |
      You are the Debugging & Reproduction Agent.
      1. Run minimal test cases against the sandbox to verify the failure.
      2. If reproducible, inspect code diffs and propose the smallest safe patch.
      3. Run regression tests against the patch and report exact pass/fail counts.

  - name: "{team}-critic"
    description: Adversarial reviewer ensuring root cause evidence is solid and patches are safe
    addressing: owner-agents
    provider: "{provider}"
    instructions: |
      You are the Adversarial SRE Reviewer.
      Your responsibility is to challenge diagnoses and remediation plans:
      1. Does the quoted log evidence strictly prove the diagnosis?
      2. Does the patch introduce unintended side effects, security flaws, or breaking schema changes?
      3. Report VERDICT: APPROVED or VERDICT: REJECTED with specific objections.

room:
  name: "{team}-incident-war-room"
  description: High-severity production incident response center
  bridge: "{bridge}"
  agents:
    - "{team}-commander"
    - "{team}-diagnostician"
    - "{team}-debugger"
    - "{team}-critic"
  users: ["{$creator}"]

kickoff: |
  🚨 Production Incident War Room Active.
  Squad standing by: @{team}-commander (Lead), @{team}-diagnostician (Analysis), @{team}-debugger (Repro/Patch), @{team}-critic (Review).

