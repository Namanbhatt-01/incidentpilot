name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check packages tests sandbox evals
          ruff format --check packages tests sandbox evals

      - name: Type check with Mypy
        run: |
          mypy packages

      - name: Run Test Suite
        run: |
          pytest tests/unit sandbox/tests tests/integration evals -v

      - name: Run 5-Scenario Evaluation Benchmark
        run: |
          python -m evals.benchmark
